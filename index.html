<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="手寫筆記">
<title>手寫筆記</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* VOICE: quiet, tool-like, out of the way of the writing
   IDEA: a stack of paper notebooks on a warm desk
   PICTURE: the page itself is the picture, everything else recedes
   COLOUR and TYPE: warm desk grey, off-white paper, one fountain-pen blue; system CJK sans
   LAYOUT: one toolbar row, full-bleed page, floating page pill */
:root{--desk:#e7e4de;--bar:#fbfaf7;--ink:#1d1d1f;--mut:#6c6b70;--line:#dcd8d0;--acc:#2448c8;--accs:rgba(36,72,200,.12);--pop:#fff;--sh:0 10px 34px rgba(30,25,15,.18);--danger:#c62828}
html[data-night]{--desk:#111214;--bar:#1b1c1f;--ink:#ececee;--mut:#9b9ba2;--line:#2d2e33;--acc:#8ea6ff;--accs:rgba(142,166,255,.16);--pop:#232428;--sh:0 10px 34px rgba(0,0,0,.55);--danger:#ff6b6b}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=text]{-webkit-user-select:text;user-select:text}
.view{position:fixed;inset:0;display:flex;flex-direction:column}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;transition:background .15s}
.ib:active{background:var(--accs)}
.ib.on{background:var(--accs);color:var(--acc)}
.ib:disabled{opacity:.28;pointer-events:none}
.btn{height:44px;padding:0 18px;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;white-space:nowrap}
html[data-night] .btn{color:#10131f}
html[data-night] .btn.ghost{color:var(--acc)}
.btn.ghost{background:var(--accs);color:var(--acc)}
.btn.danger{background:var(--danger);color:#fff}
/* home */
.hbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:max(18px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 14px max(20px,env(safe-area-inset-left))}
.hbar h1{font-size:30px;line-height:1.1;margin:0 auto 0 0;letter-spacing:.01em}
.hact{display:flex;gap:8px;align-items:center}
#grid{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px max(20px,env(safe-area-inset-right)) 40px max(20px,env(safe-area-inset-left));display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 20px;align-content:start}
.nb{display:flex;flex-direction:column;gap:8px}
.cover{position:relative;aspect-ratio:3/4;border-radius:4px 10px 10px 4px;background:#fffefb;box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 22px rgba(40,30,10,.14);overflow:hidden;display:block;width:100%}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:var(--spine);z-index:1}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.cover:active{transform:scale(.98)}
.meta{display:flex;align-items:flex-start;gap:4px}
.meta div{flex:1}
.meta b{display:block;font-size:15px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta small{color:var(--mut);font-size:13px}
.meta .ib{width:36px;height:36px;margin-top:-4px}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--mut)}
.empty h2{color:var(--ink);font-size:22px;margin:0 0 6px}
.tip{margin:0;padding:10px max(20px,env(safe-area-inset-left)) max(14px,env(safe-area-inset-bottom));font-size:13px;color:var(--mut);text-align:center}
.warn{margin:0 20px 10px;padding:10px 14px;border-radius:12px;background:#fde7e7;color:#8a1c1c;font-size:14px}
/* editor */
.bar{display:flex;align-items:center;gap:2px;padding:4px max(8px,env(safe-area-inset-right)) 4px max(8px,env(safe-area-inset-left));padding-top:max(4px,env(safe-area-inset-top));background:var(--bar);border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative;z-index:5}
.title{height:44px;padding:0 8px;font-weight:600;max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:10px}
.grow{flex:1}
.grp{display:flex;align-items:center;gap:2px}
.sep{width:1px;height:26px;background:var(--line);margin:0 6px;flex:none}
.swb{width:44px;height:44px;display:grid;place-items:center;flex:none}
.swb i{width:24px;height:24px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18),0 0 0 2px var(--bar),0 0 0 3.5px var(--line)}
.swb.none{visibility:hidden}
#saveWarn{margin:0;border-radius:0;font-size:14px;padding:8px 14px}
.savest{font-size:12px;color:var(--mut);white-space:nowrap;padding:0 4px}
.savest.error{color:#fff;background:var(--danger);border-radius:8px;padding:2px 8px;font-weight:600}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;background:var(--desk)}
#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;pointer-events:none}
.pill{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:3px;border-radius:16px;background:var(--bar);box-shadow:var(--sh);z-index:4}
.pill span{min-width:64px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums;color:var(--mut)}
.pill .ib{width:40px;height:40px}
#selbar{position:fixed;z-index:6;display:flex;gap:2px;padding:4px;border-radius:14px;background:var(--bar);box-shadow:var(--sh)}
#selbar button{height:38px;padding:0 12px;border-radius:10px;font-size:15px;white-space:nowrap}
#selbar button:active{background:var(--accs)}
#selbar .d{color:var(--danger)}
#selbar .acc{color:var(--acc);font-weight:600}
#selbar.area .ink{display:none}
#selbar{flex-wrap:wrap;max-width:calc(100vw - 16px);justify-content:center}
#quick{position:fixed;z-index:35;background:var(--pop);border-radius:20px;box-shadow:var(--sh);padding:10px;width:252px;transform-origin:50% 100%;animation:qin .14s ease-out}
@keyframes qin{from{opacity:0;transform:scale(.9)}}
#quick .qr{display:flex;justify-content:space-between;gap:4px}
#quick .qc{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin:10px 2px 4px}
#quick .qp{width:100%;height:40px;margin-top:8px;border-radius:12px;background:var(--accs);color:var(--acc);font-weight:600}
#quick .qe{float:right;color:var(--acc);font-size:12px;font-weight:600;padding:0 4px}
.dlg{max-height:calc(100vh - 40px);overflow:auto}
.qed small{display:block;font-size:12px;color:var(--mut);margin:4px 2px}
.qed .qrow{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;margin:6px 2px 12px}
.qmv{display:flex;gap:8px;margin:0 0 12px}.qmv .btn{flex:1;height:40px;padding:0}
#quick small{display:block;font-size:12px;color:var(--mut);margin:8px 4px 0}
/* drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(260px,80vw);background:var(--bar);box-shadow:var(--sh);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right)}
.dh{display:flex;align-items:center;padding:6px 6px 6px 16px;border-bottom:1px solid var(--line)}
.dh b{flex:1}
#dlist{flex:1;overflow:auto;padding:14px 22px;display:flex;flex-direction:column;gap:16px}
.pg{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.th{width:100%;background:#fffefb;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.18);overflow:hidden}
.th img{width:100%;height:100%;display:block;object-fit:cover}
.pg.cur .th{outline:3px solid var(--acc);outline-offset:2px}
.pg span{font-size:13px;color:var(--mut)}
.dact{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:8px;border-top:1px solid var(--line);padding-bottom:max(8px,env(safe-area-inset-bottom))}
.dact button{height:52px;border-radius:10px;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dact button svg{width:20px;height:20px}
.dact button:active{background:var(--accs)}
.dact .wide{grid-column:1/-1;flex-direction:row;font-size:15px;height:44px;background:var(--accs);color:var(--acc);font-weight:600}
/* popover */
#pop{position:fixed;z-index:30;background:var(--pop);border-radius:16px;box-shadow:var(--sh);padding:12px;width:min(300px,calc(100vw - 16px));max-height:calc(100vh - 80px);overflow:auto}
.ph{font-weight:700;font-size:15px;margin:2px 4px 10px}
.hint{font-size:13px;color:var(--mut);margin:6px 4px;line-height:1.5}
.cols{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.cdot{aspect-ratio:1;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);position:relative;display:block}
.cdot.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2.5px solid var(--acc)}
.cdot.custom{background:conic-gradient(red,#ff0,lime,cyan,blue,#f0f,red);overflow:hidden;cursor:pointer}
.cdot.custom input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.sl{display:flex;align-items:center;gap:10px;font-size:14px;margin:4px 4px 8px}
.sl input{flex:1;accent-color:var(--acc);height:32px}
.sl output{width:30px;text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
#pPrev{width:100%;height:44px;display:block;border-radius:10px;background:var(--desk)}
.seg{display:flex;background:var(--desk);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;height:38px;border-radius:9px;font-size:14px;white-space:nowrap}
.seg button.on{background:var(--pop);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:6px 8px;border-radius:10px;text-align:left;font-size:15px}
.mi:active{background:var(--accs)}
.mi span{flex:1}
.mi small{display:block;font-size:12px;color:var(--mut);line-height:1.35}
.mi.d{color:var(--danger)}
.hr{height:1px;background:var(--line);margin:6px 0}
input.tg{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s;margin:0;cursor:pointer}
input.tg::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
input.tg:checked{background:var(--acc)}
input.tg:checked::after{transform:translateX(20px)}
/* modal etc */
#modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:20px}
.dlg{background:var(--pop);border-radius:18px;padding:20px;width:min(380px,100%);box-shadow:var(--sh)}
.dlg h3{margin:0 0 6px;font-size:18px}
.dlg p{margin:0 0 12px;color:var(--mut);font-size:15px}
.dlg input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--desk);color:var(--ink);padding:0 12px;font-size:16px;margin:6px 0 14px}
.dlg .row{display:flex;gap:8px;justify-content:flex-end}
.dlg img{max-width:100%;max-height:60vh;display:block;margin:0 auto 12px;-webkit-touch-callout:default}
#toast{position:fixed;left:50%;top:max(70px,calc(env(safe-area-inset-top) + 60px));transform:translate(-50%,-20px);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#busy{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.4);display:grid;place-items:center}
#busy>div{background:var(--pop);border-radius:16px;padding:20px 22px;width:min(320px,86vw)}
#busy p{margin:0 0 12px;font-size:15px}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
@media (max-width:700px){
 .title{max-width:40vw}
 .bar .sep{display:none}
 .hbar h1{font-size:24px;width:100%}
 #grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:20px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div id="home" class="view">
 <header class="hbar">
  <h1>我的筆記本</h1>
  <div class="hact">
   <button class="btn" id="hNew">新筆記本</button>
   <button class="btn ghost" id="hPdf">匯入 PDF</button>
   <button class="ib" id="hMore" aria-label="更多"><svg class="i"><use href="#i-more"/></svg></button>
  </div>
 </header>
 <p id="storeWarn" class="warn" hidden>目前無法使用 iPad 的儲存空間，寫的筆記只會暫存。請完全關閉 App（從多工畫面往上滑掉）再重新打開。</p>
 <p id="bakWarn" class="warn" hidden style="background:#fff4d6;color:#6b4e00"></p>
 <main id="grid"></main>
 <p class="tip">筆記只存在這台裝置的瀏覽器裡。建議在 Safari 點「分享 → 加入主畫面」使用，並定期從右上角「⋯ → 備份」保存。</p>

<div id="editor" class="view" hidden>
 <div class="bar" id="tbar">
  <button class="ib" id="bBack" aria-label="回到筆記本列表"><svg class="i"><use href="#i-back"/></svg></button>

   <button class="ib tool" data-t="eraser" aria-label="橡皮擦"><svg class="i"><use href="#i-er"/></svg></button>
   <button class="ib tool" data-t="lasso" aria-label="套索"><svg class="i"><use href="#i-lasso"/></svg></button>
   <button class="swb" id="bSw" aria-label="顏色與粗細"><i></i></button>

   <button class="ib" id="bUndo" aria-label="復原"><svg class="i"><use href="#i-undo"/></svg></button>

  </div>
 </div>

 <div id="stage"><canvas id="cv0"></canvas><canvas id="cv1"></canvas></div>

  <button class="ib" id="bPrev" aria-label="上一頁"><svg class="i"><use href="#i-l"/></svg></button>
  <span id="pnum">1 / 1</span>
  <button class="ib" id="bNext" aria-label="下一頁"><svg class="i"><use href="#i-r"/></svg></button>

 </div>

  <button data-a="shot" class="acc">截圖</button><button data-a="copy" class="ink">拷貝</button><button data-a="cut" class="ink">剪下</button><button data-a="color" class="ink">顏色</button><button data-a="del" class="d ink">刪除</button><button data-a="done">完成</button>

   <button id="dDown"><svg class="i"><use href="#i-down"/></svg>下移</button>

/* ---------- storage ---------- */
const DB={db:null,mem:null,
 openOnce(ms){return new Promise((res,rej)=>{let done=false;const r=indexedDB.open('inkbook',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('nbs',{keyPath:'id'});d.createObjectStore('pages',{keyPath:'id'}).createIndex('nb','nb');d.createObjectStore('blobs')};r.onsuccess=()=>{const d=r.result;d.onclose=()=>{if(DB.db===d)DB.db=null};d.onversionchange=()=>{d.close();if(DB.db===d)DB.db=null};if(done){d.close();return}done=true;res(d)};r.onerror=()=>{done=true;rej(r.error)};setTimeout(()=>{if(!done){done=true;rej(new Error('timeout'))}},ms)})},

/* ---------- ui helpers ---------- */

/* ---------- strokes ---------- */

function drawContent(ctx,p,night,vis,sx){

/* ---------- state ---------- */
let nb=null,pages=[],pg=null,cur=0,sel=null,act=null,cursor=null;
const dirty=new Set();let saveT=null;
function ser(p){return {id:p.id,nb:p.nb,w:p.w,h:p.h,paper:p.paper,bg:p.bg,strokes:p.strokes.map(s=>({t:s.t,c:s.c,s:s.s,p:s.p})),images:p.images.map(i=>({id:i.id,key:i.key,x:i.x,y:i.y,w:i.w,h:i.h})),thumb:p.thumb||null}}

let saveState='ok';

function makeThumb(p){if(p.bg&&!(imgCache.get(p.bg)&&imgCache.get(p.bg).img))return p.thumb;const W=180,c=document.createElement('canvas');c.width=W;c.height=Math.round(W*p.h/p.w);const g=c.getContext('2d');g.fillStyle='#fffefb';g.fillRect(0,0,c.width,c.height);g.scale(W/p.w,W/p.w);drawContent(g,p,false,null,null);const u=c.toDataURL('image/jpeg',0.72);c.width=0;return u}

/* ---------- canvas & camera ---------- */
const stage=$('#stage'),cv0=$('#cv0'),cv1=$('#cv1'),bx=cv0.getContext('2d'),lx=cv1.getContext('2d');

let rq=0,lq=0,fq=0,idleT=0,inertia=0;
function scheduleRender(){if(!rq)rq=requestAnimationFrame(()=>{rq=0;render()})}
function liveQ(){if(!lq)lq=requestAnimationFrame(()=>{lq=0;drawLive()})}

$('#bFs').onclick=async()=>{try{if(fsEl()){await (document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{const r=(de.requestFullscreen||de.webkitRequestFullscreen).call(de);if(r&&r.then)await r}}catch(e){toast('這個環境不允許全螢幕，請把 App 加入主畫面使用')}};
const fsSync=()=>{$('#bFs use').setAttribute('href',fsEl()?'#i-fsx':'#i-fs');setTimeout(resize,120)};
document.addEventListener('fullscreenchange',fsSync);document.addEventListener('webkitfullscreenchange',fsSync);

/* ---------- pages ---------- */
function goPage(i,refit){if(!pages.length)return;i=clamp(i,0,pages.length-1);stopInertia();if(act)cancelAct();sel=null;T.clear();gest=null;cursor=null;if(pg&&dirty.has(pg))flush();pg=pages[i];cur=i;nb.last=i;layout();if(vMode()&&!refit&&SW){cam.ty=14-pg._oy*cam.s;clampCam()}else fit();render();syncUI();if(!$('#drawer').hidden)renderDrawer()}
async function addPage(after){const ref=pages[after];const p=newPage(ref&&!ref.bg?ref.paper:S.paper);pages.splice(after+1,0,p);markDirty(p);await flush();goPage(after+1);toast(`已新增第 ${after+2} 頁`)}
async function delPage(i){
 if(pages.length===1){if(await modal({title:'清空這一頁？',text:'這是最後一頁，會清除所有筆跡和圖片。',ok:'清空',danger:true})){pushUndo(snapshot());pg.strokes=[];pg.images=[];render();markDirty()}return}
 if(!await modal({title:`刪除第 ${i+1} 頁？`,text:'刪除後無法復原。',ok:'刪除',danger:true}))return;
 const p=pages.splice(i,1)[0];dirty.delete(p);await DB.del('pages',p.id);const used=new Set(pages.flatMap(keysOf));for(const k of keysOf(p))if(!used.has(k))DB.del('blobs',k);pg=null;await flush();goPage(Math.min(i,pages.length-1))}
function renderDrawer(){if(pg&&pg._td){pg.thumb=makeThumb(pg)}const d=$('#dlist');d.innerHTML=pages.map((p,i)=>`<div class="pg ${i===cur?'cur':''}" data-i="${i}"><div class="th" style="aspect-ratio:${p.w}/${p.h}">${p.thumb?`<img src="${p.thumb}" alt="">`:''}</div><span>${i+1}</span></div>`).join('');const c=d.querySelector('.cur');if(c)c.scrollIntoView({block:'nearest'});$('#dUp').disabled=cur===0;$('#dDown').disabled=cur===pages.length-1}
$('#dlist').onclick=e=>{const p=e.target.closest('.pg');if(p)goPage(+p.dataset.i)};
$('#bPages').onclick=()=>{const d=$('#drawer');d.hidden=!d.hidden;if(!d.hidden)renderDrawer()};
$('#dClose').onclick=()=>{$('#drawer').hidden=true};
function movePage(dir){const j=cur+dir;if(j<0||j>=pages.length)return;[pages[cur],pages[j]]=[pages[j],pages[cur]];flush();goPage(j)}
$('#dUp').onclick=()=>movePage(-1);$('#dDown').onclick=()=>movePage(1);
$('#dDup').onclick=async()=>{const r=JSON.parse(JSON.stringify(ser(pg)));r.id=uid();r.images.forEach(i=>i.id=uid());const p=deser(r);pages.splice(cur+1,0,p);markDirty(p);await flush();goPage(cur+1);toast('已複製這一頁')};
$('#dDel').onclick=()=>delPage(cur);
$('#dAdd').onclick=()=>addPage(cur);

/* ---------- images ---------- */
function fileToImg(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{res(i);setTimeout(()=>URL.revokeObjectURL(u),1000)};i.onerror=()=>rej(new Error('img'));i.src=u})}
$('#fImg').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f&&pg)insertImageFile(f)};
async function insertImageFile(f,at){try{const im=await fileToImg(f),w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,2048/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);const png=/png|gif|webp/.test(f.type);const blob=await toBlob(c,png?'image/png':'image/jpeg',0.9);c.width=0;const key=uid();await DB.put('blobs',{type:blob.type,buf:await blob.arrayBuffer()},key);
 const cx=at?at.x:(SW/2-cam.tx)/cam.s,cy=at?at.y:(SH/2-cam.ty)/cam.s-pg._oy,dw=Math.min(pg.w*0.6,SW/cam.s*0.6),dh=dw*h/w,o={id:uid(),key,x:clamp(cx-dw/2,0,Math.max(0,pg.w-dw)),y:clamp(cy-dh/2,0,Math.max(0,pg.h-dh)),w:dw,h:dh};
 await loadImgP(key);pushUndo(snapshot());pg.images.push(o);setTool('lasso');makeSel(new Set(),new Set([o]));placeSelBar();markDirty();toast('可以拖曳移動圖片，拉右下角圓點縮放')}catch(err){toast('無法讀取這張圖片')}}

/* ---------- pdf import ---------- */
let pdfInto=false;
const absU=u=>new URL(u,location.href).href;
async function loadPdfJs(){if(window.pdfjsLib)return window.pdfjsLib;let local=true;try{await loadScript('pdf.min.js')}catch(e){local=false;await loadScript(PDFCDN+'pdf.min.js')}const L=window.pdfjsLib;L.GlobalWorkerOptions.workerSrc=local?absU('pdf.worker.min.js'):PDFCDN+'pdf.worker.min.js';L._local=local;return L}
const pdfData={};
function pdfBundle(n){return pdfData[n]||(pdfData[n]=(async()=>{const u=[absU(n+'.json'),'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/'+(n==='cmaps'?'cmaps/':'standard_fonts/')];try{const r=await fetch(u[0]);if(!r.ok)throw 0;return {map:await r.json()}}catch(e){pdfData[n]=null;return {cdn:u[1]}}})())}
class PdfCMap{async fetch({name}){const b=await pdfBundle('cmaps');let d;if(b.map){if(!b.map[name])throw new Error('CMap '+name);d=new Uint8Array(unb64(b.map[name]))}else{const r=await fetch(b.cdn+name+'.bcmap');d=new Uint8Array(await r.arrayBuffer())}return {cMapData:d,compressionType:1}}}
class PdfFont{async fetch({filename}){const b=await pdfBundle('fonts');if(b.map){if(!b.map[filename])throw new Error('font '+filename);return new Uint8Array(unb64(b.map[filename]))}const r=await fetch(b.cdn+filename);return new Uint8Array(await r.arrayBuffer())}}
$('#fPdf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importPdf(f,pdfInto);pdfInto=false};
async function importPdf(file,into){let L;busy('正在準備 PDF 工具…',0);try{L=await loadPdfJs()}catch(e){busy(null);toast('無法載入 PDF 工具，請確認網路連線');return}
 try{const data=new Uint8Array(await file.arrayBuffer());const opt={data,isEvalSupported:false,useWorkerFetch:false,CMapReaderFactory:PdfCMap,StandardFontDataFactory:PdfFont,useSystemFonts:true};
  const doc=await L.getDocument(opt).promise,N=doc.numPages;
  const target=into?nb:{id:uid(),name:file.name.replace(/\.pdf$/i,'')||'PDF',pageIds:[],created:Date.now(),updated:Date.now(),cover:null,last:0};
  const c=document.createElement('canvas'),g=c.getContext('2d'),made=[];
  for(let i=1;i<=N;i++){busy(`正在匯入第 ${i} / ${N} 頁…`,(i-1)/N);const page=await doc.getPage(i),v1=page.getViewport({scale:1});const sc=Math.min(2000/v1.width,Math.sqrt(6e6/(v1.width*v1.height)));const vp=page.getViewport({scale:sc});c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);g.setTransform(1,0,0,1,0,0);g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);await page.render({canvasContext:g,viewport:vp}).promise;
   const blob=await toBlob(c,'image/jpeg',0.88),key=uid();await DB.put('blobs',{type:'image/jpeg',buf:await blob.arrayBuffer()},key);
   const t=document.createElement('canvas');t.width=180;t.height=Math.round(180*c.height/c.width);t.getContext('2d').drawImage(c,0,0,t.width,t.height);const thumb=t.toDataURL('image/jpeg',0.72);t.width=0;
   const p={id:uid(),nb:target.id,w:1000,h:Math.round(1000*c.height/c.width),paper:'blank',bg:key,strokes:[],images:[],thumb};await DB.put('pages',p);made.push(p);if(page.cleanup)page.cleanup()}
  c.width=0;try{doc.destroy()}catch(_){}
  if(into){const at=cur+1;pages.splice(at,0,...made.map(deser));await flush();busy(null);goPage(at);toast(`已插入 ${made.length} 頁`)}
  else{target.pageIds=made.map(p=>p.id);target.cover=made[0]&&made[0].thumb;await DB.put('nbs',target);busy(null);openNb(target.id)}
 }catch(e){busy(null);toast(e&&e.name==='PasswordException'?'這個 PDF 有密碼保護，無法匯入':'匯入失敗：'+(e&&e.message||e))}}

/* ---------- export ---------- */
async function renderExport(c,p){const g=c.getContext('2d');g.setTransform(1,0,0,1,0,0);g.fillStyle='#ffffff';g.fillRect(0,0,c.width,c.height);for(const k of keysOf(p))await loadImgP(k);const k=c.width/p.w;g.setTransform(k,0,0,k,0,0);drawContent(g,p,false,null,null)}
async function exportPng(){busy('正在匯出圖片…',0.3);try{const c=document.createElement('canvas');c.width=2000;c.height=Math.round(2000*pg.h/pg.w);await renderExport(c,pg);const b=await toBlob(c,'image/png');c.width=0;busy(null);await saveFile(safeName(nb.name)+`-第${cur+1}頁.png`,b)}catch(e){busy(null);toast('匯出失敗：'+(e&&e.message||e))}}
function buildPdf(list){const enc=new TextEncoder(),parts=[],offs=[];let len=0;const add=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);len+=u.length};
 add('%PDF-1.4\n');add(new Uint8Array([37,226,227,207,211,10]));const n=list.length;
 offs[1]=len;add('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
 offs[2]=len;add(`2 0 obj\n<< /Type /Pages /Kids [${list.map((_,i)=>`${3+3*i} 0 R`).join(' ')}] /Count ${n} >>\nendobj\n`);
 list.forEach((p,i)=>{const po=3+3*i,co=po+1,io=po+2,pw=p.pw.toFixed(2),ph=p.ph.toFixed(2),cs=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
  offs[po]=len;add(`${po} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 ${io} 0 R >> >> /Contents ${co} 0 R >>\nendobj\n`);
  offs[co]=len;add(`${co} 0 obj\n<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`);
  offs[io]=len;add(`${io} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.W} /Height ${p.H} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpg.length} >>\nstream\n`);add(p.jpg);add('\nendstream\nendobj\n')});
 const total=3+3*n,xo=len;let x=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let i=1;i<total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';add(x);add(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xo}\n%%EOF\n`);return new Blob(parts,{type:'application/pdf'})}
async function exportPdf(name,list){busy('正在匯出 PDF…',0);try{const out=[],c=document.createElement('canvas'),keep=new Set(pg?keysOf(pg):[]);for(let i=0;i<list.length;i++){const p=list[i],W=1654,H=Math.round(W*p.h/p.w);c.width=W;c.height=H;await renderExport(c,p);const b=await toBlob(c,'image/jpeg',0.9);out.push({jpg:new Uint8Array(await b.arrayBuffer()),W,H,pw:595.28,ph:595.28*p.h/p.w});busy(`正在匯出 PDF…（${i+1} / ${list.length}）`,(i+1)/list.length);if(i%4===3)evictExcept(keep)}c.width=0;evictExcept(keep);const pdf=buildPdf(out);busy(null);await saveFile(safeName(name)+'.pdf',pdf)}catch(e){busy(null);toast('匯出失敗：'+(e&&e.message||e))}}

/* ---------- notebooks / home ---------- */
const spine=id=>{let h=0;for(const ch of id)h=(h*31+ch.charCodeAt(0))%360;return `hsl(${h} 45% 45%)`};
async function renderHome(){const list=(await DB.all('nbs')).sort((a,b)=>(b.updated||0)-(a.updated||0));const g=$('#grid');{const w=$('#bakWarn'),lb=S.lastBackup||0,days=Math.floor((Date.now()-lb)/864e5),changed=list.some(n=>(n.updated||0)>lb);if(list.length&&changed&&days>=3){w.hidden=false;w.innerHTML=(lb?`已經 ${days} 天沒有備份了。`:'還沒有備份過。')+' <button class="btn ghost" id="bakNow" style="height:34px;margin-left:6px">立即備份</button>';w.querySelector('#bakNow').onclick=()=>backup()}else w.hidden=true}
 g.innerHTML=list.length?list.map(n=>`<div class="nb" data-id="${esc(n.id)}"><button class="cover" data-open style="--spine:${spine(n.id)}" aria-label="開啟 ${esc(n.name)}">${n.cover?`<img src="${n.cover}" alt="">`:''}</button><div class="meta"><div><b>${esc(n.name)}</b><small>${(n.pageIds||[]).length} 頁 · ${fmtDate(n.updated||n.created)}</small></div><button class="ib" data-more aria-label="筆記本選項"><svg class="i"><use href="#i-more"/></svg></button></div></div>`).join(''):`<div class="empty"><h2>還沒有筆記本</h2><p>點「新筆記本」開始手寫，或「匯入 PDF」直接在講義上寫。</p></div>`}
$('#grid').onclick=e=>{const card=e.target.closest('.nb');if(!card)return;const id=card.dataset.id;if(e.target.closest('[data-open]'))openNb(id);else if(e.target.closest('[data-more]')){const a=e.target.closest('[data-more]');openPop(a,`<button class="mi" data-x="ren"><span>重新命名</span></button><button class="mi" data-x="pdf"><span>匯出 PDF</span></button><button class="mi d" data-x="del"><span>刪除筆記本</span></button>`,el=>{el.onclick=async ev=>{const b=ev.target.closest('[data-x]');if(!b)return;closePop();const n=await DB.get('nbs',id);if(!n)return;
 if(b.dataset.x==='ren'){const v=await modal({title:'重新命名筆記本',input:n.name,ok:'儲存'});if(v){n.name=v;await DB.put('nbs',n);renderHome()}}
 else if(b.dataset.x==='pdf'){const recs=await DB.pagesOf(id),m=new Map(recs.map(r=>[r.id,r]));await exportPdf(n.name,n.pageIds.map(i=>m.get(i)).filter(Boolean).map(deser));evictExcept(new Set())}
 else{if(!await modal({title:`刪除「${n.name}」？`,text:'筆記本裡的所有頁面都會被刪除，無法復原。',ok:'刪除',danger:true}))return;const recs=await DB.pagesOf(id);for(const r of recs){for(const k of keysOf(r))await DB.del('blobs',k);await DB.del('pages',r.id)}await DB.del('nbs',id);renderHome()}}})}};
async function openNb(id){const n=await DB.get('nbs',id);if(!n){toast('找不到這本筆記本');return}nb=n;nb.pageIds=nb.pageIds||[];const recs=await DB.pagesOf(id),m=new Map(recs.map(r=>[r.id,r]));pages=nb.pageIds.map(i=>m.get(i)).filter(Boolean).map(deser);if(!pages.length){const p=newPage();pages=[p];markDirty(p)}
 $('#home').hidden=true;$('#editor').hidden=false;$('#drawer').hidden=true;$('#bTitle').textContent=nb.name;pg=null;cur=0;syncUI();await new Promise(r=>requestAnimationFrame(r));resize();goPage(nb.last||0,true)}
async function showHome(){closePop();stopInertia();if(act)cancelAct();sel=null;HU=[];HR=[];for(const p of pages)dropCache(p);await flush();pg=null;nb=null;pages=[];evictExcept(new Set());selbar.hidden=true;$('#drawer').hidden=true;$('#editor').hidden=true;$('#home').hidden=false;renderHome()}
$('#hNew').onclick=async()=>{const list=await DB.all('nbs');const name=await modal({title:'新筆記本',input:`筆記本 ${list.length+1}`,ok:'建立',html:`<p style="margin:0">紙張：可在筆記本內的「⋯」更換</p>`});if(!name)return;nb={id:uid(),name,pageIds:[],created:Date.now(),updated:Date.now(),cover:null,last:0};const p=newPage();pages=[p];markDirty(p);await flush();openNb(nb.id)};
$('#hPdf').onclick=()=>{pdfInto=false;$('#fPdf').click()};
$('#hMore').onclick=e=>openPop(e.currentTarget,`<button class="mi" id="xBak"><span>備份全部筆記<small>匯出成一個 .json 檔，換裝置或清除資料前請先備份</small></span></button><button class="mi" id="xRes"><span>從備份還原</span></button><div class="hr"></div><label class="mi"><span>夜間模式</span><input type="checkbox" class="tg" id="xNight" ${S.night?'checked':''}></label><p class="hint" id="xUse"></p>`,el=>{
 el.querySelector('#xBak').onclick=()=>{closePop();backup()};el.querySelector('#xRes').onclick=()=>{closePop();$('#fBak').click()};
 el.querySelector('#xNight').onchange=ev=>{S.night=ev.target.checked;saveS();applyNight()};
 try{navigator.storage.estimate().then(u=>{const x=el.querySelector('#xUse');if(x)x.textContent=`目前使用 ${(u.usage/1048576).toFixed(1)} MB`})}catch(_){}});
async function backup(){busy('正在備份…',0);try{const nbs=await DB.all('nbs'),pgs=await DB.all('pages'),keys=await DB.keys('blobs'),parts=['{"app":"inkbook","v":1,"nbs":',JSON.stringify(nbs),',"pages":',JSON.stringify(pgs),',"blobs":{'];let cnt=0;
 for(let i=0;i<keys.length;i++){const r=await DB.get('blobs',keys[i]);if(r)parts.push((cnt++?',':'')+JSON.stringify(String(keys[i]))+':'+JSON.stringify({type:r.type,b64:b64(r.buf)}));busy('正在備份…',(i+1)/keys.length)}
 parts.push('}}');busy(null);const d=new Date();if(await saveFile(`手寫筆記備份-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`,new Blob(parts,{type:'application/json'}))){S.lastBackup=Date.now();saveS();renderHome()}}catch(e){busy(null);toast('備份失敗：'+(e&&e.message||e))}}
$('#fBak').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;busy('正在還原…',0);try{const j=JSON.parse(await f.text());if(j.app!=='inkbook')throw new Error('這不是手寫筆記的備份檔');const ks=Object.keys(j.blobs||{});for(let i=0;i<ks.length;i++){const v=j.blobs[ks[i]];await DB.put('blobs',{type:v.type,buf:unb64(v.b64)},ks[i]);busy('正在還原…',(i+1)/(ks.length+1))}for(const p of j.pages||[])await DB.put('pages',p);for(const n of j.nbs||[])await DB.put('nbs',n);busy(null);toast(`已還原 ${(j.nbs||[]).length} 本筆記本`);renderHome()}catch(err){busy(null);toast('還原失敗：'+(err&&err.message||err))}};

/* ---------- lifecycle ---------- */
function rescueDirty(){for(const p of dirty)rescue('p.'+p.id,{...ser(p),thumb:null});if(nb&&pages.length&&dirty.size)rescue('n.'+nb.id,{...nb,pageIds:pages.map(x=>x.id),updated:Date.now(),cover:null})}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){rescueDirty();flush()}else if(!DB.mem){DB.get('nbs','__ping').catch(()=>{});if(dirty.size)flush()}});
addEventListener('pagehide',()=>{rescueDirty();flush()});
(async()=>{applyNight();syncUI();const ok=await DB.open();if(!ok){$('#storeWarn').hidden=false;modal({title:'無法存取儲存空間',text:'iPad 的儲存空間沒有回應，現在寫的筆記可能無法保存。建議先完全關閉 App（從多工畫面往上滑掉），再重新打開。',ok:'知道了',cancel:''})}else{const n=await recoverRescue();if(n)toast(`已救回 ${n} 頁上次沒存好的筆記`)}try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(_){}renderHome()})();
window.__ink={DB,get dirty(){return dirty},get cam(){return cam},get cur(){return cur},get pg(){return pg},get pages(){return pages},S,undo,redo};
}
